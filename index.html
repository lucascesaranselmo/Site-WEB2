<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistema do Terceirão</title>

        <style>
            /* Reset básico para evitar scrolls estranhos */
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: black;
                color: #00ff88;
                font-family: 'Courier New', Courier, monospace;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                text-align: center;
                overflow-x: hidden;
            }

            /* CAPA INTERATIVA RESPONSIVA */
            #capaInterativa {
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background-color: black;
                background-image: url('https://upload.wikimedia.org/wikipedia/commons/5/56/Bsodwindows10.png'); 
                background-size: cover;
                background-position: center;
                z-index: 2000;
                cursor: pointer;
                transition: opacity 1s ease;
            }

            /* CAIXA PRINCIPAL */
            .caixa {
                border: 2px solid #00ff88;
                padding: 20px;
                width: 90%;
                max-width: 500px;
                background: rgba(0, 0, 0, 0.9);
                box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
            }

            h2 { font-size: 1.5rem; margin-bottom: 15px; }
            p { font-size: 1rem; margin: 10px 0; }

            /* BOTÕES RESPONSIVOS */
            .botoes-container {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-top: 20px;
            }

            button {
                background: black;
                color: #00ff88;
                border: 2px solid #00ff88;
                padding: 15px;
                font-size: 1rem;
                cursor: pointer;
                font-family: monospace;
                font-weight: bold;
                transition: 0.3s;
            }

            button:hover {
                background: #00ff88;
                color: black;
            }

            /* JANELA DE VÍDEO (MODAL) */
            #janelaVideo {
                display: none;
                position: fixed;
                top: 50%; left: 50%;
                transform: translate(-50%, -50%);
                background: black;
                border: 3px solid #00ff88;
                padding: 15px;
                z-index: 1001;
                width: 95%;
                max-width: 450px;
                box-shadow: 0 0 30px #00ff88;
            }

            video {
                width: 100%; /* O vídeo ocupa toda a largura da modal */
                height: auto;
                border: 1px solid #00ff88;
            }

            .overlay {
                display: none;
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0,0,0,0.85);
                z-index: 1000;
            }

            /* Ajustes para telas maiores */
            @media (min-width: 600px) {
                .botoes-container {
                    flex-direction: row;
                    justify-content: center;
                }
                button { font-size: 0.9rem; }
            }
        </style>
    </head>

    <body>

        <div id="capaInterativa" onclick="removerCapa()"></div>

        <div class="caixa">
            <h2>⚠ SISTEMA DO TERCEIRÃO ⚠</h2>
            <p>RESULTADO FINAL:<br><strong>Professor Jeferson (Jefinho)</strong></p>
            <p>✔ Inteligente | ✔ Gente boa | ✔ Guenta nóis</p>
            <hr style="border: 0; border-top: 1px solid #00ff88; margin: 20px 0;">
            <h2>⭐ PADRINHO DO TERCEIRÃO ⭐</h2>
            <p>Aceitar missão?</p>

            <div class="botoes-container">
                <button onclick="mostrarVideo()">SIM</button>
                <button onclick="mostrarVideo()">CLARO</button>
                <button onclick="mostrarVideo()">NÃO TEM ESCOLHA</button>
            </div>
        </div>

        <div id="fundoEscuro" class="overlay"></div>
        
        <div id="janelaVideo">
            <h3>MISSÃO ACEITA! 🎉</h3>
            <p style="font-size: 0.8rem; margin-bottom: 10px;">Aguarde o carregamento...</p>
            <video controls id="meuVideo">
                <source src="WhatsApp Video 2026-03-25 at 21.19.04.mp4" type="video/mp4">
                Seu navegador não suporta vídeos.
            </video>
            <br>
            <button onclick="fecharVideo()" style="margin-top: 15px; width: 100%;">FECHAR</button>
        </div>

        <script>
            function removerCapa() {
                const capa = document.getElementById('capaInterativa');
                capa.style.opacity = '0';
                setTimeout(() => {
                    capa.style.display = 'none';
                }, 1000);
            }

            function mostrarVideo() {
                alert("Parabéns Professor Jefinho! Você agora é oficialmente o padrinho do terceirão! 🎉");
                document.getElementById('janelaVideo').style.display = 'block';
                document.getElementById('fundoEscuro').style.display = 'block';
                document.getElementById('meuVideo').play();
            }

            function fecharVideo() {
                document.getElementById('janelaVideo').style.display = 'none';
                document.getElementById('fundoEscuro').style.display = 'none';
                document.getElementById('meuVideo').pause();
            }
        </script>
    </body>
</html>
